name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/.vitepress/**'
      - 'docs/scripts/**'
      - 'docs/package*.json'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/.vitepress/**'
      - 'docs/scripts/**'
      - 'docs/package*.json'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build project
      run: dotnet build -c Release

    - name: Run test cases
      run: dotnet test -c Release --no-build

    - name: Run automation examples without a terminal
      shell: pwsh
      run: |
        foreach ($framework in 'net8.0', 'net10.0') {
          dotnet run --project samples/Sharprompt.Automation -c Release -f $framework --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Verify packaged API documentation
      shell: pwsh
      run: |
        dotnet pack src/Sharprompt -c Release --no-build -o artifacts/packages
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $package = Get-ChildItem artifacts/packages/Sharprompt.*.nupkg | Select-Object -First 1
        $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
        try {
          foreach ($framework in 'net8.0', 'net10.0') {
            if (-not $archive.GetEntry("lib/$framework/Sharprompt.xml")) {
              throw "Missing XML API documentation for $framework."
            }
          }
        } finally {
          $archive.Dispose()
        }

    - name: Lint C# code
      run: dotnet format --verify-no-changes --verbosity detailed --no-restore

  native-aot:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Verify Native AOT publishing and execution
      shell: pwsh
      run: ./tests/Sharprompt.NativeAot/verify.ps1
